name: Forex data validation

on:
  push:
    branches:
      - feat/forex-intelligence-foundation
    paths:
      - "tradingagents/dataflows/forex.py"
      - "tradingagents/dataflows/vendors/forex.py"
      - "tests/test_forex_*.py"
      - ".github/workflows/forex-data-tests.yml"
  pull_request:
    paths:
      - "tradingagents/dataflows/forex.py"
      - "tradingagents/dataflows/vendors/forex.py"
      - "tests/test_forex_*.py"
      - ".github/workflows/forex-data-tests.yml"

jobs:
  forex-data-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest python-dotenv
      - name: Run FX data tests
        run: python -m pytest tests/test_forex_data.py tests/test_forex_provider.py -q
